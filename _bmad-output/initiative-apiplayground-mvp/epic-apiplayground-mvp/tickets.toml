# Epic entries in build order. This approved set uses a documented safety-first exception to the default tracer-first rule.

[[entry]]
id = 1
type = "story"
title = "Local platform baseline"
description = "Sets up local React, ASP.NET Core, and PostgreSQL services, configuration, startup instructions, database migrations, minimum build/test checks including CI, and a reusable controlled-target test harness without enabling outbound request dispatch."
verify = "A person starts the services from the documented instructions, migrations apply to a fresh local PostgreSQL instance, the harness self-test runs without dispatching a request, and local plus CI baseline checks pass."
covers = []
after = []
hitl = true
risk = "medium"
references = ["../spec-apiplayground/stack.md", "epic-apiplayground-mvp.md"]

[[entry]]
id = 2
type = "story"
title = "Outbound request safety foundation"
description = "After the project owner approves the outbound policy and test target, implements the backend guard for allowed destinations, SSRF and DNS/rebinding protections, redirects, timeout, and response-size limits with focused tests while keeping UI dispatch disabled."
verify = "Tests against the approved target confirm allow/deny, DNS/rebinding and redirect handling, timeout enforcement during dispatch, and response-size rejection before acceptance, while no UI path can dispatch."
covers = []
after = [1]
hitl = false
risk = "high"
unknown = "The project owner must approve allowed destinations and the controlled test target, plus the exact SSRF, DNS/rebinding, redirect, timeout, and response-size policies before implementation or outbound testing."
references = ["../spec-apiplayground/spec-apiplayground.md#constraints", "../spec-apiplayground/mvp-scope.md#request-safety-requirements"]
notes = ["The closing independent outbound-safety suite in Story 9 is a check outside this story's own tests."]

[[entry]]
id = 3
type = "story"
title = "Guarded GET tracer"
description = "Uses Stories 1 and 2 to connect the cold-open UI, backend, and approved outbound guard for a GET that displays a minimal result and performs a temporary persistence smoke check without implementing the full response viewer or History."
verify = "After the policy and test target are approved, the cold-open UI shows blank URL and disabled Send, an approved controlled GET passes through the guard and displays a minimal result, a policy rejection is reported as not sent, and a non-sensitive persistence marker is inserted, read, and removed."
covers = ["CAP-1", "CAP-2"]
after = [1, 2]
hitl = false
risk = "high"
references = ["../spec-apiplayground/spec-apiplayground.md#capabilities", "../ux-apiplayground/DESIGN.md", "../ux-apiplayground/EXPERIENCE.md", "../ux-apiplayground/mockups/workspace-cold-open.html"]
notes = ["The independent safety suite and separate human confirmation are in Story 9; Story 2's approved policy gate must be resolved before any outbound dispatch."]

[[entry]]
id = 4
type = "story"
title = "Complete request methods and inputs"
description = "Extends the guarded request path from Story 3 to GET, POST, PUT, PATCH, and DELETE with URL, query parameters, enabled headers, and JSON body, including the UX-defined controls, basic validation, sending progress, and duplicate-send prevention."
verify = "A controlled target receives the configured method and values, disabled rows, malformed URLs, and invalid JSON are not sent, Send shows progress and prevents duplicate dispatch while labeling the previous result, request and response panes are side by side on desktop and stack when narrow, and request controls work by keyboard with visible focus."
covers = ["CAP-1"]
after = [3]
hitl = false
risk = "medium"
references = ["../spec-apiplayground/spec-apiplayground.md#capabilities", "../ux-apiplayground/DESIGN.md", "../ux-apiplayground/EXPERIENCE.md"]

[[entry]]
id = 5
type = "story"
title = "Inspect HTTP response details"
description = "Expands Story 3's result contract to show the complete observed status, elapsed time, response headers, and body with Body and Headers tabs, Body selected by default, and readable formatted JSON without a raw-mode toggle."
verify = "Controlled success and HTTP-error responses show status, elapsed time, headers, and body with Body selected by default, formatted JSON and working Body/Headers tabs, while timeout and other transport outcomes remain distinct, accessible, and free of unsupported cause claims."
covers = ["CAP-2"]
after = [3, 4]
hitl = false
risk = "medium"
references = ["../spec-apiplayground/spec-apiplayground.md#capabilities", "../ux-apiplayground/DESIGN.md", "../ux-apiplayground/EXPERIENCE.md"]

[[entry]]
id = 6
type = "story"
title = "Browse and replay request history"
description = "Uses Story 1's persistence foundation, Story 4's request representation, and Story 5's response-reset behavior to store and list dispatched attempts, load them without sending, and replay them only through Story 2's guard."
verify = "History preserves ordinary request fields, includes HTTP and post-dispatch transport attempts but excludes validation failures and pre-dispatch security blocks, loading never sends and clears stale response, replay explicitly uses the guard, failed History persistence does not block dispatch and reports the unsaved entry, and omitted sensitive values reload blank and disabled for re-entry."
covers = ["CAP-3"]
after = [1, 2, 4, 5]
hitl = false
risk = "medium"
unknown = "The project owner must decide the sensitive-header classification before History persists request values; until then, sensitive values must not be stored."
references = ["../spec-apiplayground/spec-apiplayground.md#capabilities", "../ux-apiplayground/EXPERIENCE.md"]

[[entry]]
id = 7
type = "story"
title = "Save requests in persistent collections"
description = "Extends Story 6's stored request representation with explicit collection saves, an editable method/path title suggestion, inline collection selection or creation, and the same sensitive-header omission behavior."
verify = "Saved requests remain available after a local restart, selection loads without sending and clears stale response, failed saves retain the form values with retry available, the flow is keyboard- and focus-operable, and sensitive values are not persisted."
covers = ["CAP-4"]
after = [6]
hitl = false
risk = "medium"
unknown = "The project owner must decide the sensitive-header classification before Collections persist request values; until then, sensitive values must not be stored."
references = ["../spec-apiplayground/spec-apiplayground.md#capabilities", "../ux-apiplayground/DESIGN.md", "../ux-apiplayground/EXPERIENCE.md"]

[[entry]]
id = 8
type = "story"
title = "Refactor sweep"
description = "Resolves only concrete cleanup findings accepted in the plans or reviews for Stories 1–7 without adding product features or deferred scope."
verify = "Each accepted cleanup finding is resolved or explicitly deferred with the owner's agreement, relevant checks pass, and no interface or behavior regression is introduced."
covers = []
after = [1, 2, 3, 4, 5, 6, 7]
hitl = false
risk = "medium"

[[entry]]
id = 9
type = "story"
title = "Integrated local MVP and outbound-safety suite"
description = "Independently verifies the integrated CAP-1–CAP-4 flows on the local UI/API/PostgreSQL stack and the safeguards implemented in Story 2 using Story 1's harness and approved policy cases, with a person separately confirming the suite results."
verify = "A local end-to-end path covers configured dispatch, full response inspection, History replay, and collection reuse after restart; independent approved-target cases exercise allow/deny, DNS/rebinding, redirects, timeout, and response-size enforcement against the settled policy; a person separately records confirmation of the results."
covers = ["CAP-1", "CAP-2", "CAP-3", "CAP-4"]
after = [8]
hitl = true
risk = "high"
unknown = "The approved test target and security-policy decisions must be settled before dispatch or policy-specific suite cases can run; this suite verifies decisions but does not make them."
references = ["../spec-apiplayground/spec-apiplayground.md#success-signal", "../spec-apiplayground/mvp-scope.md#request-safety-requirements", "../ux-apiplayground/EXPERIENCE.md"]
notes = ["A person separately confirms the safety-suite results; this confirmation is outside the suite's automated pass/fail check."]