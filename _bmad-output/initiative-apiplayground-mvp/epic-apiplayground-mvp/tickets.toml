# Epic entries in build order. This approved set uses a documented safety-first exception to the default tracer-first rule.

[[entry]]
id = 1
type = "story"
title = "Local platform baseline"
description = "Sets up local React, ASP.NET Core, and PostgreSQL services, configuration, startup instructions, database migrations, minimum build/test checks including CI, and a reusable controlled-target test harness without enabling outbound request dispatch."
verify = "A person starts the services from the documented instructions, migrations apply to a fresh local PostgreSQL instance, the harness self-test runs without dispatching a request, and local plus CI baseline checks pass."
covers = []
after = []
hitl = true
risk = "medium"
references = ["../spec-apiplayground/stack.md", "epic-apiplayground-mvp.md"]

[[entry]]
id = 10
type = "story"
title = "Backend Clean Architecture boundaries"
description = "After the completed local platform baseline and before outbound-safety implementation, establish the approved four-project Clean Architecture boundaries for the ASP.NET Core backend. Move the current DbContext and EF Core migrations into Infrastructure, keep Story 1's migration identity/history compatible with both fresh and already-initialized local databases, update the API composition root, solution, tests, and CI, and add automated dependency/dispatch-boundary checks without adding a request-sending endpoint or enabling outbound dispatch."
verify = "Project references enforce Domain <- Application <- Infrastructure with Api as the only composition root allowed to reference Infrastructure; forbidden dependency/direct target-dispatch checks pass; preserve the existing PlatformDbContext identity unless an explicit compatibility path is proven; the same initial migration is recognized exactly once on a fresh database and a database already migrated by Story 1; a subsequent Infrastructure migration is discoverable/applicable without a second history stream; current compatible EF Core/Npgsql patches are verified and pinned; local setup still uses host PostgreSQL without requiring Docker; CI provisions PostgreSQL for persistence tests and fails rather than silently skipping them; no request-sending endpoint or outbound dispatch is introduced."
covers = []
after = [1]
hitl = true
risk = "medium"
references = ["../spec-apiplayground/stack.md", "epic-apiplayground-mvp.md", "story-local-platform-baseline-plan.md", "../architecture-apiplayground-backend/architecture-apiplayground-backend.md"]

[[entry]]
id = 2
type = "story"
title = "Outbound request safety foundation"
description = "After ticket 10 establishes the backend project boundaries and the project owner approves the outbound policy and test target, implements the single guarded Infrastructure outbound adapter for allowed destinations, SSRF and DNS/rebinding protections, redirects, timeout, and response-size limits with focused tests while keeping UI dispatch disabled."
verify = "Tests against the approved target confirm allow/deny, DNS/rebinding and redirect handling, timeout enforcement during dispatch, and response-size rejection before acceptance, while no UI path can dispatch."
covers = []
after = [1, 10]
hitl = false
risk = "high"
references = ["../spec-apiplayground/spec-apiplayground.md#constraints", "../spec-apiplayground/mvp-scope.md#request-safety-requirements"]
notes = ["The closing independent outbound-safety suite in Story 9 is a check outside this story's own tests."]

[[entry]]
id = 3
type = "story"
title = "Guarded GET tracer"
description = "Uses ticket 10's backend boundaries and Stories 1 and 2 to connect the cold-open UI, API/Application path, and approved guarded Infrastructure outbound adapter for a GET that displays a minimal result and performs a temporary persistence smoke check without implementing the full response viewer or History."
verify = "After the policy and test target are approved and Stories 2 and 10 are complete, the cold-open UI shows blank URL and disabled Send; before enabling browser-triggered dispatch, selected Host/origin/request protections are tested for the loopback workflow (CORS alone is insufficient); an approved controlled GET passes through the guard and displays a minimal result, a policy rejection is reported as not sent, and a non-sensitive persistence marker is inserted, read, and removed."
covers = ["CAP-1", "CAP-2"]
after = [1, 2, 10]
hitl = false
risk = "high"
references = ["../spec-apiplayground/spec-apiplayground.md#capabilities", "../ux-apiplayground/DESIGN.md", "../ux-apiplayground/EXPERIENCE.md", "../ux-apiplayground/mockups/workspace-cold-open.html", "../architecture-apiplayground-backend/architecture-apiplayground-backend.md"]
notes = ["The independent safety suite and separate human confirmation are in Story 9; Story 2's approved policy gate must be resolved before any outbound dispatch."]

[[entry]]
id = 4
type = "story"
title = "Complete request methods and inputs"
description = "Extends the guarded request path from Story 3 to GET, POST, PUT, PATCH, and DELETE with URL, query parameters, enabled headers, and JSON body, including the UX-defined controls, basic validation, sending progress, and duplicate-send prevention."
verify = "A controlled target receives the configured method and values, disabled rows, malformed URLs, and invalid JSON are not sent, Send shows progress and prevents duplicate dispatch while labeling the previous result, request and response panes are side by side on desktop and stack when narrow, and request controls work by keyboard with visible focus."
covers = ["CAP-1"]
after = [3]
hitl = false
risk = "medium"
references = ["../spec-apiplayground/spec-apiplayground.md#capabilities", "../ux-apiplayground/DESIGN.md", "../ux-apiplayground/EXPERIENCE.md"]

[[entry]]
id = 5
type = "story"
title = "Inspect HTTP response details"
description = "Expands Story 3's result contract to show the complete observed status, elapsed time, response headers, and body with Body and Headers tabs, Body selected by default, and readable formatted JSON without a raw-mode toggle."
verify = "Controlled success and HTTP-error responses show status, elapsed time, headers, and body with Body selected by default, formatted JSON and working Body/Headers tabs, while timeout and other transport outcomes remain distinct, accessible, and free of unsupported cause claims."
covers = ["CAP-2"]
after = [3, 4]
hitl = false
risk = "medium"
references = ["../spec-apiplayground/spec-apiplayground.md#capabilities", "../ux-apiplayground/DESIGN.md", "../ux-apiplayground/EXPERIENCE.md"]

[[entry]]
id = 6
type = "story"
title = "Browse and replay request history"
description = "Uses ticket 10's Infrastructure/Application persistence boundary, Story 1's persistence foundation, Story 4's request representation, and Story 5's response-reset behavior to store and list dispatched attempts, load them without sending, and replay them only through Story 2's guarded outbound port."
verify = "History preserves ordinary request fields, includes HTTP and post-dispatch transport attempts but excludes validation failures and pre-dispatch security blocks, loading never sends and clears stale response, replay explicitly uses the guard, failed History persistence does not block dispatch and reports the unsaved entry, and omitted sensitive values reload blank and disabled for re-entry."
covers = ["CAP-3"]
after = [1, 2, 4, 5, 10]
hitl = false
risk = "medium"
notes = ["Decision: 2026-10-23 — History must omit values for Authorization, Proxy-Authorization, Cookie, and Set-Cookie, plus case-insensitive header names containing api-key/apikey, auth-token, access-token, refresh-token, or token; retain other header values."]
references = ["../spec-apiplayground/spec-apiplayground.md#capabilities", "../ux-apiplayground/EXPERIENCE.md"]

