<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ApiPlayground — Request workspace</title>
  <style>
    /* Governing spine sections: DESIGN Components/Colors/Layout; EXPERIENCE IA/State Patterns/Interaction. */
    :root {
      color-scheme: light;
      --background: #F3F5F7;
      --surface: #FFFFFF;
      --text: #26313D;
      --muted: #667483;
      --border: #D9E0E6;
      --action: #315F83;
      --accent: #347B78;
      --error: #B34242;
      --font-interface: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-data: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      --radius-sm: 0.25rem;
      --radius-md: 0.375rem;
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.5rem;
      --space-6: 2rem;
      font-family: var(--font-interface);
      color: var(--text);
      background: var(--background);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    body { min-width: 760px; min-height: 100vh; margin: 0; padding: 38px 48px; background: var(--background); }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid var(--action);
      outline-offset: 3px;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }

    .browser {
      width: min(1320px, 100%);
      min-height: 740px;
      margin: 0 auto;
      overflow: hidden;
      border: 2px solid var(--action);
      border-radius: var(--radius-md);
      background: var(--surface);
    }
    .browser-chrome {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      min-height: 58px;
      padding: 0 var(--space-4);
      border-bottom: 1px solid var(--border);
      background: var(--background);
    }
    .browser-controls { display: flex; align-items: center; gap: var(--space-2); color: var(--text); }
    .chrome-button {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      font-size: 17px;
      line-height: 1;
    }
    .browser-tab {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      width: 208px;
      height: 36px;
      padding: 0 var(--space-3);
      border: 1px solid var(--border);
      border-bottom: 2px solid var(--action);
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      background: var(--surface);
      color: var(--text);
      font-size: 0.875rem;
      font-weight: 600;
    }
    .tab-mark { width: 10px; height: 10px; border: 2px solid var(--accent); border-radius: 50%; }
    .address-bar {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
      height: 34px;
      flex: 1;
      padding: 0 var(--space-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--muted);
      font-family: var(--font-data);
      font-size: 0.8125rem;
    }
    .address-mark { color: var(--text); font-family: var(--font-interface); font-size: 0.875rem; }
    .chrome-menu { width: 28px; color: var(--text); text-align: center; font-size: 20px; letter-spacing: 2px; }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
      padding: 0 var(--space-5);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .brand { display: flex; align-items: center; gap: var(--space-4); }
    .brand-name { margin: 0; font-size: 1rem; font-weight: 650; letter-spacing: -0.02em; }
    .workspace-label { padding-left: var(--space-4); border-left: 1px solid var(--border); color: var(--muted); font-size: 0.875rem; }

    .workspace { display: grid; grid-template-columns: 60px minmax(0, 1fr); min-height: 608px; background: var(--background); }
    .collapsed-sidebar {
      display: flex;
      align-items: center;
      flex-direction: column;
      gap: var(--space-4);
      padding: var(--space-4) 0;
      border-right: 1px solid var(--border);
      background: var(--surface);
    }
    .expand-sidebar {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      padding: 0;
      border: 2px solid var(--action);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--action);
      font-size: 20px;
      line-height: 1;
    }
    .sidebar-name {
      margin: var(--space-2) 0 0;
      color: var(--text);
      font-size: 0.8125rem;
      font-weight: 550;
      letter-spacing: 0.01em;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .panes {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: var(--space-4);
      align-items: stretch;
      padding: var(--space-5);
    }
    .pane {
      display: flex;
      min-width: 0;
      min-height: 540px;
      flex-direction: column;
      padding: var(--space-4);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
    }
    .pane-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-3);
      margin: 0 0 var(--space-4);
    }
    .pane-heading h1, .pane-heading h2 { margin: 0; font-size: 1.125rem; font-weight: 600; line-height: 1.35; }
    .pane-kind { color: var(--muted); font-size: 0.8125rem; }

    .request-line {
      display: grid;
      grid-template-columns: 100px minmax(0, 1fr) 86px;
      align-items: stretch;
      min-height: 48px;
      overflow: hidden;
      border: 2px solid var(--action);
      border-radius: var(--radius-sm);
      background: var(--surface);
    }
    .method {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      border-right: 1px solid var(--border);
      color: var(--accent);
      font-family: var(--font-data);
      font-size: 0.875rem;
      font-weight: 700;
    }
    .method-caret { color: var(--text); font-family: var(--font-interface); font-size: 0.75rem; }
    .url-field {
      width: 100%;
      min-width: 0;
      padding: 0 var(--space-3);
      border: 0;
      border-radius: 0;
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-data);
      font-size: 0.875rem;
    }
    .url-field::placeholder { color: var(--muted); opacity: 1; }
    .url-field:focus-visible { outline: 3px solid var(--action); outline-offset: -4px; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
    .send-button {
      align-self: center;
      min-height: 34px;
      margin-right: 6px;
      border: 2px dashed var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: not-allowed;
    }
    .request-tabs, .response-tabs {
      display: flex;
      align-items: center;
      gap: var(--space-5);
      min-height: 50px;
      border-bottom: 1px solid var(--border);
    }
    .request-tab, .response-tab {
      align-self: stretch;
      display: inline-flex;
      align-items: center;
      padding: 0 2px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
    }
    .request-tab { cursor: default; }
    .response-tab { cursor: default; }
    .response-tab[aria-selected="true"] {
      border-bottom-color: var(--action);
      color: var(--action);
      font-weight: 700;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 5px;
    }
    .request-editor-space { flex: 1; min-height: 300px; }
    .response-body {
      display: grid;
      flex: 1;
      min-height: 300px;
      place-items: center;
      padding: var(--space-5);
      text-align: center;
    }
    .response-prompt {
      max-width: 310px;
      margin: 0;
      color: var(--text);
      font-size: 1rem;
      line-height: 1.5;
    }

    @media (max-width: 980px) {
      body { min-width: 0; padding: 18px; }
      .browser { min-height: 0; }
      .workspace { min-height: 0; }
      .panes { grid-template-columns: 1fr; }
      .pane { min-height: 410px; }
      .request-editor-space, .response-body { min-height: 250px; }
      .browser-tab { width: 160px; }
    }
  </style>
</head>
<body>
  <main class="browser" aria-label="ApiPlayground desktop browser window">
    <div class="browser-chrome" aria-label="Browser frame">
      <div class="browser-controls" aria-hidden="true">
        <span class="chrome-button">‹</span>
        <span class="chrome-button">›</span>
        <span class="chrome-button">↻</span>
      </div>
      <div class="browser-tab"><span class="tab-mark" aria-hidden="true"></span>ApiPlayground</div>
      <div class="address-bar"><span class="address-mark" aria-hidden="true">⌂</span><span>localhost</span></div>
      <div class="chrome-menu" aria-hidden="true">···</div>
    </div>

    <header class="app-header">
      <div class="brand">
        <p class="brand-name">ApiPlayground</p>
        <span class="workspace-label">Request workspace</span>
      </div>
    </header>

    <div class="workspace">
      <aside class="collapsed-sidebar" aria-label="History and collections, collapsed">
        <button class="expand-sidebar" type="button" aria-label="Expand History &amp; Collections" title="Expand History &amp; Collections">›</button>
        <p class="sidebar-name">History &amp; Collections</p>
      </aside>

      <div class="panes">
        <section class="pane" aria-labelledby="request-heading">
          <div class="pane-heading">
            <h1 id="request-heading">Request</h1>
          </div>
          <div class="request-line" aria-label="Request method, URL, and send action">
            <div class="method" aria-label="Method: GET">GET <span class="method-caret" aria-hidden="true">▾</span></div>
            <input class="url-field" type="text" aria-label="Request URL" placeholder="Enter URL" value="">
            <button class="send-button" type="button" disabled>Send</button>
          </div>
          <div class="request-tabs" aria-label="Request sections">
            <button class="request-tab" type="button">Params</button>
            <button class="request-tab" type="button">Headers</button>
            <button class="request-tab" type="button">Body</button>
          </div>
          <div class="request-editor-space" aria-hidden="true"></div>
        </section>

        <section class="pane" aria-labelledby="response-heading">
          <div class="pane-heading">
            <h2 id="response-heading">Response</h2>
          </div>
          <div class="response-tabs" role="tablist" aria-label="Response content">
            <button class="response-tab" type="button" role="tab" aria-selected="true">Body</button>
            <button class="response-tab" type="button" role="tab" aria-selected="false">Headers</button>
          </div>
          <div class="response-body" role="tabpanel" aria-label="Response body">
            <div>
              <p class="response-prompt">Enter a URL to send a request.</p>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
